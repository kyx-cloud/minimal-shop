<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="布落之處商品列表 — 縫紉機零件、針具、壓布腳、線材全系列">
  <title>全部商品 — 布落之處</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Shop 頁面追加樣式 ── */
    .filter-mobile-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--c-border);
      margin-bottom: 24px;
    }
    .filter-toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      border: 1px solid var(--c-border);
      padding: 10px 20px;
      transition: border-color var(--dur) var(--ease);
    }
    .filter-toggle-btn:hover { border-color: var(--c-text); }
    @media (max-width: 768px) {
      .filter-mobile-bar { display: flex; }
      .shop-sidebar {
        border: 1px solid var(--c-border);
        padding: 24px;
        margin-bottom: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">
      <button class="menu-btn" id="menuBtn" aria-label="開啟選單" aria-expanded="false">
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
      </button>

      <a href="index.html" class="site-logo">
        <img src="images/logo.png" alt="布落之處" class="site-logo__img" onerror="this.style.display='none'">
        <span class="site-logo__text">布落之處</span>
      </a>

      <nav class="site-nav">
        <a href="index.html" class="site-nav__link">首頁</a>
        <a href="shop.html" class="site-nav__link is-active">商品</a>
        <a href="index.html#editorial" class="site-nav__link">關於</a>
        <a href="index.html#newsletter" class="site-nav__link">聯絡</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" aria-label="搜尋">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
        <a href="cart.html" class="icon-btn cart-icon" aria-label="購物車">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-count is-hidden" id="cartCount">0</span>
        </a>
      </div>
    </div>

    <div class="search-overlay" id="searchOverlay">
      <div class="search-overlay__inner">
        <input type="search" class="search-input" id="searchInput" placeholder="搜尋商品、分類或關鍵字…" autocomplete="off">
        <button class="search-close-btn" id="searchCloseBtn" aria-label="關閉搜尋">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
      <nav class="mobile-menu__nav">
        <a href="index.html" class="mobile-menu__link">首頁</a>
        <a href="shop.html" class="mobile-menu__link">商品</a>
        <a href="index.html#editorial" class="mobile-menu__link">關於</a>
        <a href="index.html#newsletter" class="mobile-menu__link">聯絡</a>
      </nav>
      <div class="mobile-menu__footer">
        <a href="cart.html" class="mobile-menu__link">購物車</a>
      </div>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="shop-main">
    <div class="container">

      <!-- 頁面標題與控制列 -->
      <div class="shop-header">
        <div>
          <h1 class="page-title">全部商品</h1>
          <p class="product-count" id="productCount">載入中…</p>
        </div>
        <select class="sort-select" id="sortSelect" aria-label="排序方式">
          <option value="default">預設排序</option>
          <option value="price-asc">價格：由低到高</option>
          <option value="price-desc">價格：由高到低</option>
          <option value="name-asc">名稱：A–Z</option>
        </select>
      </div>

      <!-- 手機篩選按鈕（僅手機顯示） -->
      <div class="filter-mobile-bar">
        <button class="filter-toggle-btn" id="filterToggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="12" y1="18" x2="20" y2="18"/>
          </svg>
          篩選
        </button>
        <span class="product-count" id="productCountMobile"></span>
      </div>

      <div class="shop-layout">

        <!-- 左側篩選欄 -->
        <aside class="shop-sidebar" id="shopSidebar">
          <!-- 分類篩選 -->
          <div class="filter-section">
            <h3 class="filter-title">分類</h3>
            <div class="filter-options" id="categoryFilters">
              <label class="filter-option">
                <input type="checkbox" value="縫紉機零件">縫紉機零件
              </label>
              <label class="filter-option">
                <input type="checkbox" value="針具">針具
              </label>
              <label class="filter-option">
                <input type="checkbox" value="壓布腳">壓布腳
              </label>
              <label class="filter-option">
                <input type="checkbox" value="線材">線材
              </label>
              <label class="filter-option">
                <input type="checkbox" value="其他配件">其他配件
              </label>
            </div>
          </div>

          <!-- 價格篩選 -->
          <div class="filter-section">
            <h3 class="filter-title">價格範圍</h3>
            <div class="price-range">
              <div class="price-inputs">
                <input type="number" id="priceMin" placeholder="最低" min="0" aria-label="最低價格">
                <span>—</span>
                <input type="number" id="priceMax" placeholder="最高" min="0" aria-label="最高價格">
              </div>
              <button class="btn btn--small btn--outline" id="applyPrice">套用</button>
            </div>
          </div>

          <!-- 材質篩選 -->
          <div class="filter-section">
            <h3 class="filter-title">材質</h3>
            <div class="filter-options" id="materialFilters">
              <label class="filter-option">
                <input type="checkbox" value="不鏽鋼">不鏽鋼
              </label>
              <label class="filter-option">
                <input type="checkbox" value="棉質">棉質
              </label>
              <label class="filter-option">
                <input type="checkbox" value="鍍金">鍍金
              </label>
              <label class="filter-option">
                <input type="checkbox" value="合金">合金
              </label>
            </div>
          </div>

          <button class="btn btn--outline btn--full" id="clearFilters">清除所有篩選</button>
        </aside>

        <!-- 右側商品網格 -->
        <div class="shop-content">
          <div class="products-grid" id="shopProductsGrid">
            <!-- 由 script.js 動態渲染 -->
          </div>

          <!-- 分頁 -->
          <div class="pagination" id="pagination">
            <button class="page-btn" id="prevPage" disabled>← 上一頁</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button class="page-btn" id="nextPage">下一頁 →</button>
          </div>
        </div>

      </div><!-- /shop-layout -->
    </div><!-- /container -->
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="index.html" class="site-logo">
            <span class="site-logo__text">布落之處</span>
          </a>
          <p class="footer-brand__desc">精選紡織零件，為每一位工藝職人提供最可靠的專業工具。</p>
          <div class="social-links">
            <a href="#" class="social-link" aria-label="Instagram">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
              </svg>
            </a>
            <a href="#" class="social-link" aria-label="Facebook">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
              </svg>
            </a>
          </div>
        </div>
        <div class="footer-col">
          <h4 class="footer-col__title">商品分類</h4>
          <ul class="footer-links">
            <li><a href="shop.html?category=%E7%B8%AB%E7%B4%9D%E6%A9%9F%E9%9B%B6%E4%BB%B6">縫紉機零件</a></li>
            <li><a href="shop.html?category=%E9%87%9D%E5%85%B7">針具</a></li>
            <li><a href="shop.html?category=%E5%A3%93%E5%B8%83%E8%85%B3">壓布腳</a></li>
            <li><a href="shop.html?category=%E7%B7%9A%E6%9D%90">線材</a></li>
            <li><a href="shop.html?category=%E5%85%B6%E4%BB%96%E9%85%8D%E4%BB%B6">其他配件</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 class="footer-col__title">客戶服務</h4>
          <ul class="footer-links">
            <li><a href="#">常見問題</a></li>
            <li><a href="#">退換貨政策</a></li>
            <li><a href="#">運送說明</a></li>
            <li><a href="#">隱私政策</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 class="footer-col__title">聯絡我們</h4>
          <ul class="footer-contact">
            <li>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
              service@buluo.tw
            </li>
            <li>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              週一至週五 10:00–18:00
            </li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2024 布落之處. All rights reserved.</p>
        <div class="footer-bottom__links">
          <a href="#">隱私政策</a>
          <a href="#">使用條款</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
