<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單成立 — 布落之處</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .success-main {
      min-height: calc(100vh - var(--header-h));
      display: flex;
      align-items: flex-start;
      padding: 80px 0 120px;
    }
    .success-wrap {
      max-width: 580px;
      margin: 0 auto;
      width: 100%;
    }

    /* 頂部圖示 */
    .success-icon {
      width: 60px; height: 60px;
      border: 1px solid #C8E6C9;
      border-radius: 50%;
      background: #F1F8F1;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      color: #388E3C;
    }

    /* 標題 */
    .success-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 300;
      letter-spacing: -0.04em;
      text-align: center;
      margin-bottom: 10px;
    }
    .success-subtitle {
      text-align: center;
      color: var(--c-text-2);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 48px;
    }

    /* 訂單資訊卡片 */
    .order-card {
      border: 1px solid var(--c-border);
      margin-bottom: 28px;
    }
    .order-card__head {
      padding: 22px 26px;
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .order-num-label { font-size: 11px; color: var(--c-text-3); letter-spacing: 0.06em; margin-bottom: 4px; }
    .order-num-value { font-size: 16px; font-weight: 500; letter-spacing: 0.04em; }

    /* 付款狀態 badge */
    .pay-badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 14px;
    }
    .pay-badge--paid    { background: #E8F5E9; color: #2E7D32; }
    .pay-badge--pending { background: #FFF3E0; color: #E65100; }

    /* 資訊欄位 */
    .order-card__body { padding: 26px; }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 26px;
    }
    .info-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-text-3);
      margin-bottom: 5px;
    }
    .info-value { font-size: 14px; color: var(--c-text); line-height: 1.5; }

    /* 金額 */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--c-border);
    }
    .total-label { font-size: 13px; color: var(--c-text-2); }
    .total-value { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }

    /* CTA 按鈕 */
    .success-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .success-actions .btn { min-width: 160px; justify-content: center; }

    /* Loading / Error */
    .state-loading,
    .state-error {
      text-align: center;
      padding: 60px 0;
      color: var(--c-text-3);
    }
    .state-error { color: #C62828; }

    @media (max-width: 600px) {
      .success-main  { padding: 48px 0 80px; }
      .info-grid     { grid-template-columns: 1fr; gap: 14px; }
      .order-card__head { flex-direction: column; align-items: flex-start; }
      .success-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header" id="siteHeader">
    <div class="header-container">
      <button class="menu-btn" id="menuBtn" aria-label="開啟選單" aria-expanded="false">
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
        <span class="menu-btn__bar"></span>
      </button>
      <a href="index.html" class="site-logo">
        <img src="images/logo.png" alt="布落之處" class="site-logo__img" onerror="this.style.display='none'">
        <span class="site-logo__text">布落之處</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" class="site-nav__link">首頁</a>
        <a href="shop.html" class="site-nav__link">商品</a>
        <a href="index.html#editorial" class="site-nav__link">關於</a>
        <a href="index.html#newsletter" class="site-nav__link">聯絡</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn cart-icon" aria-label="購物車">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="cart-count is-hidden" id="cartCount">0</span>
        </a>
      </div>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <nav class="mobile-menu__nav">
        <a href="index.html" class="mobile-menu__link">首頁</a>
        <a href="shop.html" class="mobile-menu__link">商品</a>
      </nav>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>
  </header>

  <main class="success-main">
    <div class="container">
      <div class="success-wrap" id="pageContent">
        <div class="state-loading">載入訂單資料中…</div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    const API_BASE    = window.location.protocol === 'file:' ? 'http://localhost:3001' : '';
    const orderNumber = new URLSearchParams(window.location.search).get('order');

    function fmtPrice(n) {
      return 'NT$ ' + Number(n).toLocaleString('zh-TW');
    }
    function payLabel(m) {
      return { mock_credit: '信用卡付款', mock_atm: 'ATM 轉帳', cod: '貨到付款' }[m] || m;
    }

    async function renderSuccess() {
      const wrap = document.getElementById('pageContent');

      if (!orderNumber) {
        wrap.innerHTML = `<p class="state-error">找不到訂單編號，請確認網址是否正確。<br><a href="index.html" style="color:#686868;text-decoration:underline">返回首頁</a></p>`;
        return;
      }

      try {
        const res  = await fetch(`${API_BASE}/api/orders/${orderNumber}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        const o = json.data;

        const isPaid   = o.payment_status === '已付款';
        const isCOD    = o.payment_method === 'cod';
        const badgeClass = isPaid ? 'pay-badge--paid' : 'pay-badge--pending';
        const badgeText  = isPaid ? '付款成功' : '待付款';

        document.title = `訂單成立 ${o.order_number} — 布落之處`;

        wrap.innerHTML = `
          <div class="success-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>

          <h1 class="success-title">訂單成立！</h1>
          <p class="success-subtitle">
            ${isCOD
              ? '您選擇貨到付款，我們將盡快備貨出貨，<br>收貨時請以現金支付。'
              : '付款模擬成功，感謝您的訂購！<br>我們將盡快為您備貨出貨。'}
          </p>

          <div class="order-card">
            <div class="order-card__head">
              <div>
                <p class="order-num-label">訂單編號</p>
                <p class="order-num-value">${o.order_number}</p>
              </div>
              <span class="pay-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="order-card__body">
              <div class="info-grid">
                <div>
                  <p class="info-label">顧客姓名</p>
                  <p class="info-value">${o.customer_name}</p>
                </div>
                <div>
                  <p class="info-label">付款方式</p>
                  <p class="info-value">${payLabel(o.payment_method)}</p>
                </div>
                <div>
                  <p class="info-label">聯絡電話</p>
                  <p class="info-value">${o.customer_phone}</p>
                </div>
                <div>
                  <p class="info-label">電子信箱</p>
                  <p class="info-value">${o.customer_email}</p>
                </div>
                <div style="grid-column:1/-1">
                  <p class="info-label">收件地址</p>
                  <p class="info-value">${o.customer_address}</p>
                </div>
                ${o.notes ? `<div style="grid-column:1/-1"><p class="info-label">備註</p><p class="info-value">${o.notes}</p></div>` : ''}
              </div>

              <div class="total-row">
                <span class="total-label">訂單總金額</span>
                <span class="total-value">${fmtPrice(o.total)}</span>
              </div>
            </div>
          </div>

          <div class="success-actions">
            <a href="index.html" class="btn btn--outline">返回首頁</a>
            <a href="order-complete.html?order=${o.order_number}" class="btn btn--primary">查看訂單詳情</a>
          </div>
        `;

      } catch (err) {
        wrap.innerHTML = `
          <p class="state-error">
            無法載入訂單資料：${err.message}<br>
            <small style="color:var(--c-text-3)">請確認後端服務是否已啟動（http://localhost:3001）</small>
          </p>
          <div style="text-align:center;margin-top:24px">
            <a href="index.html" class="btn btn--primary">返回首頁</a>
          </div>
        `;
      }
    }

    renderSuccess();
    Cart.updateCountUI();
  </script>
</body>
</html>
