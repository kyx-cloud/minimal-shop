<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 / 加入會員 — 布落之處</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .auth-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--c-border-lt);
    }
    .auth-header__logo {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c-text);
    }
    .auth-header__back {
      font-size: 12px;
      color: var(--c-text-3);
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .auth-header__back:hover { color: var(--c-text); }
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      background: var(--c-bg-warm);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--c-bg);
      padding: 56px 52px 64px;
    }
    .auth-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-text-3);
      margin-bottom: 6px;
    }
    .auth-heading {
      font-size: 1.45rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }
    .auth-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--c-border-lt);
      margin-bottom: 38px;
    }
    .auth-tab {
      flex: 1;
      padding: 13px 0;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--c-text-3);
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .auth-tab.is-active { color: var(--c-text); border-bottom-color: var(--c-text); }
    .auth-form { display: none; }
    .auth-form.is-active { display: block; }
    .auth-field { margin-bottom: 28px; }
    .auth-label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--c-text-3);
      margin-bottom: 10px;
    }
    .auth-input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--c-border);
      padding: 10px 0;
      font-size: 15px;
      font-family: inherit;
      color: var(--c-text);
      background: transparent;
      outline: none;
      transition: border-color 0.25s;
    }
    .auth-input:focus { border-bottom-color: var(--c-text); }
    .auth-input::placeholder { color: var(--c-text-3); }
    .auth-error {
      display: none;
      padding: 14px 18px;
      background: #fef2f2;
      border-left: 3px solid #f87171;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .auth-btn {
      width: 100%;
      margin-top: 8px;
      justify-content: center;
    }
    .auth-switch {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: var(--c-text-3);
    }
    .auth-switch button {
      background: none;
      border: none;
      font: inherit;
      color: var(--c-text);
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    @media (max-width: 520px) {
      .auth-card { padding: 40px 28px 48px; }
      .auth-header { padding: 20px 24px; }
    }
  </style>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="auth-header__logo">布落之處</a>
    <a href="index.html" class="auth-header__back">返回首頁 →</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <p class="auth-eyebrow">會員系統</p>
      <h1 class="auth-heading" id="authHeading">歡迎回來</h1>

      <div class="auth-tabs">
        <button class="auth-tab is-active" id="tabLogin">登入</button>
        <button class="auth-tab" id="tabRegister">加入會員</button>
      </div>

      <!-- ── 登入 ── -->
      <div class="auth-form is-active" id="formLogin">
        <div class="auth-error" id="loginError"></div>
        <div class="auth-field">
          <label class="auth-label" for="loginEmail">電子信箱</label>
          <input class="auth-input" type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="loginPw">密碼</label>
          <input class="auth-input" type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn--primary auth-btn" id="loginBtn">登入</button>
        <p class="auth-switch">沒有帳號？<button id="switchToReg">立即加入</button></p>
      </div>

      <!-- ── 加入會員 ── -->
      <div class="auth-form" id="formRegister">
        <div class="auth-error" id="regError"></div>
        <div class="auth-field">
          <label class="auth-label" for="regName">姓名</label>
          <input class="auth-input" type="text" id="regName" placeholder="您的姓名" autocomplete="name">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="regEmail">電子信箱</label>
          <input class="auth-input" type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label class="auth-label" for="regPw">密碼</label>
          <input class="auth-input" type="password" id="regPw" placeholder="至少 6 個字元" autocomplete="new-password">
        </div>
        <button class="btn btn--primary auth-btn" id="regBtn">建立帳號</button>
        <p class="auth-switch">已有帳號？<button id="switchToLogin">立即登入</button></p>
      </div>
    </div>
  </main>

  <script src="auth.js"></script>
  <script>
    /* 已登入直接跳轉 */
    const nextUrl = new URLSearchParams(location.search).get('next') || 'profile.html';
    if (Auth.isLoggedIn()) location.href = nextUrl;

    /* ── Tab 切換 ── */
    function showTab(t) {
      const isL = t === 'login';
      document.getElementById('tabLogin').classList.toggle('is-active', isL);
      document.getElementById('tabRegister').classList.toggle('is-active', !isL);
      document.getElementById('formLogin').classList.toggle('is-active', isL);
      document.getElementById('formRegister').classList.toggle('is-active', !isL);
      document.getElementById('authHeading').textContent = isL ? '歡迎回來' : '建立帳號';
    }
    document.getElementById('tabLogin').addEventListener('click', () => showTab('login'));
    document.getElementById('tabRegister').addEventListener('click', () => showTab('register'));
    document.getElementById('switchToReg').addEventListener('click', () => showTab('register'));
    document.getElementById('switchToLogin').addEventListener('click', () => showTab('login'));

    /* ── 登入 ── */
    async function doLogin() {
      const err = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      err.style.display = 'none';
      btn.textContent = '登入中…'; btn.disabled = true;
      try {
        const d = await Auth.login(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPw').value
        );
        if (d.success) { location.href = nextUrl; }
        else { err.textContent = d.message; err.style.display = 'block'; }
      } catch {
        err.textContent = '無法連線至伺服器，請確認後端已啟動（port 3001）。';
        err.style.display = 'block';
      } finally {
        btn.textContent = '登入'; btn.disabled = false;
      }
    }
    document.getElementById('loginBtn').addEventListener('click', doLogin);

    /* ── 加入會員 ── */
    async function doRegister() {
      const err = document.getElementById('regError');
      const btn = document.getElementById('regBtn');
      err.style.display = 'none';
      btn.textContent = '建立中…'; btn.disabled = true;
      try {
        const d = await Auth.register(
          document.getElementById('regName').value,
          document.getElementById('regEmail').value,
          document.getElementById('regPw').value
        );
        if (d.success) { location.href = nextUrl; }
        else { err.textContent = d.message; err.style.display = 'block'; }
      } catch {
        err.textContent = '無法連線至伺服器，請確認後端已啟動（port 3001）。';
        err.style.display = 'block';
      } finally {
        btn.textContent = '建立帳號'; btn.disabled = false;
      }
    }
    document.getElementById('regBtn').addEventListener('click', doRegister);

    /* Enter 鍵送出 */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('formLogin').classList.contains('is-active')) doLogin();
      else doRegister();
    });
  </script>
</body>
</html>
